name: API

on:
  push:
    paths:
      - 'apps/qwksearch-web/**'
      - 'packages/agent-toolkit/**'
      - 'packages/extract-webpage/**'
      - '.github/workflows/test-qwksearch-web.yml'
  pull_request:
    paths:
      - 'apps/qwksearch-web/**'
      - 'packages/agent-toolkit/**'
      - 'packages/extract-webpage/**'
      - '.github/workflows/test-qwksearch-web.yml'

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --ignore-scripts

      - name: Run tests
        working-directory: apps/qwksearch-web
        run: bun run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/qwksearch-web/coverage/
          if-no-files-found: ignore

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/qwksearch-web/test-report.junit.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: apps/qwksearch-web/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: qwksearch-web
          fail_ci_if_error: false
