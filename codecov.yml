ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.next/**"
  - "**/.output/**"
  - "**/.wxt/**"
  - "**/.svelte-kit/**"
  - "**/coverage/**"
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*.config.*"
  - "**/*.d.ts"
  - "**/*.gen.ts"
  - "packages/language-model-training/**"
  - "packages/searxng-search-cloudflare/**"
  # A vendored pnpm workspace that no coverage job installs or runs; without
  # this it would land in the "Apps" component via `apps/**`.
  - "apps/qwk-in-lobe/**"
