name: Build and deploy web and .com apps to Cloudflare Workers

on:
  # Deploy automatically for every push/commit to any branch.
  push:
    paths:
      - 'apps/**'
      - '.github/workflows/cloudflare-workers-deploy.yml'

  # Allows a manual deployment of one selected app.
  workflow_dispatch:
    inputs:
      app:
        description: 'Optional directory name under apps/. Leave empty to deploy all folders containing web or .com.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Avoid two deployments from the same branch running at once.
  group: cloudflare-workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover deployable apps
    runs-on: ubuntu-latest

    outputs:
      apps: ${{ steps.select.outputs.apps }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select deployable apps
        id: select
        shell: bash
        env:
          REQUESTED_APP: ${{ inputs.app }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_APP}" ]]; then
            if [[ ! -d "apps/${REQUESTED_APP}" ]]; then
              echo "::error::Directory apps/${REQUESTED_APP} does not exist."
              exit 1
            fi

            apps=$(jq -cn --arg app "${REQUESTED_APP}" '[ $app ]')
          else
            apps=$(
              find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
                | grep -Ei 'web|\.com' \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
          fi

          if [[ "${apps}" == "[]" ]]; then
            echo "::error::No direct directories in apps/ contain 'web' or '.com'."
            exit 1
          fi

          echo "Deploying: ${apps}"
          echo "apps=${apps}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Build and deploy ${{ matrix.app }}
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Node 24 prevents intentionally selecting the deprecated Node 20 runtime.
      # No npm cache here: it safely supports apps with or without package-lock.json.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Show app files
        run: |
          echo "Deploying app: ${{ matrix.app }}"
          echo "Current directory: $(pwd)"
          ls -la

      # npm ci needs a package-lock.json. npm install works both with and without one.
      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build --if-present

      - name: Deploy Worker with Wrangler
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
